name: Shadow Runtime CI

on:
  pull_request:
    paths:
      - "realtime-gateway/**"
      - "core-service/**"
      - ".github/workflows/shadow-runtime-ci.yml"
  push:
    branches:
      - feature/llm-observability-hardening

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: realtime-gateway/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B test
